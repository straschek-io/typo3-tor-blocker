name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    name: tests (PHP ${{ matrix.php-version }}, TYPO3 ${{ matrix.typo3-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '7.4'
            typo3-version: '^10.4'
          - php-version: '8.2'
            typo3-version: '^12.4'
          - php-version: '8.3'
            typo3-version: '^13.4'
          - php-version: '8.3'
            typo3-version: '^14.3'
          - php-version: '8.4'
            typo3-version: '^14.3'
          - php-version: '8.5'
            typo3-version: '^14.3'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - run: composer require "typo3/cms-core:${{ matrix.typo3-version }}" "typo3/cms-fluid:${{ matrix.typo3-version }}" --no-update
      # TYPO3 10.4 and 12.4 are past free security support; their packages carry open
      # advisories and Composer 2.9+ refuses them unless blocking is disabled. Older
      # Composer versions do not know the key and do not block either, hence "|| true".
      - if: matrix.typo3-version == '^10.4' || matrix.typo3-version == '^12.4'
        run: composer config audit.block-insecure false || true
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/phpunit

  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
      # Pin the lowest supported core, so the code style check runs on PHP 7.4; without
      # the pin Composer only offers 13.4, because it blocks the insecure 10.4 and 12.4
      - run: composer require "typo3/cms-core:^10.4" "typo3/cms-fluid:^10.4" --no-update
      - run: composer config audit.block-insecure false || true
      - run: composer config platform.php 7.4.33
      - run: composer install --no-progress --no-interaction
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
